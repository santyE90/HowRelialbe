name: Deploy production

'on':
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA already merged to main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: howreliable-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate trusted commit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Require an exact commit contained in main
        id: commit
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full lowercase 40-character Git SHA" >&2
            exit 1
          fi
          resolved_sha="$(git rev-parse HEAD)"
          test "$resolved_sha" = "$REQUESTED_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$resolved_sha" origin/main
          echo "sha=$resolved_sha" >> "$GITHUB_OUTPUT"
          echo "Selected trusted commit: $resolved_sha"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install validation environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Rerun deployment-critical CI gate
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m mypy
          python -m pip check
          python -m pytest
          python -m howreliable.ci.contract validate --root .
          python -m howreliable.cd.contract validate --root .

  deploy:
    name: Deploy immutable image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
      AWS_REGION: ${{ vars.HOWRELIABLE_AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.HOWRELIABLE_ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.HOWRELIABLE_ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.HOWRELIABLE_ECS_SERVICE }}
      API_BASE_URL: ${{ vars.HOWRELIABLE_API_BASE_URL }}
      S3_BUCKET: ${{ vars.HOWRELIABLE_S3_BUCKET }}
      S3_PREFIX: ${{ vars.HOWRELIABLE_S3_PREFIX }}
      TASK_ROLE_ARN: ${{ vars.HOWRELIABLE_TASK_ROLE_ARN }}
      EXECUTION_ROLE_ARN: ${{ vars.HOWRELIABLE_EXECUTION_ROLE_ARN }}
      ALLOW_HTTP_SMOKE: ${{ vars.HOWRELIABLE_ALLOW_HTTP_SMOKE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install deployment support code
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Validate required production configuration
        env:
          DEPLOY_ROLE_ARN: ${{ vars.HOWRELIABLE_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          for name in DEPLOY_ROLE_ARN AWS_REGION ECR_REPOSITORY ECS_CLUSTER ECS_SERVICE API_BASE_URL S3_BUCKET TASK_ROLE_ARN EXECUTION_ROLE_ARN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required production variable is missing: $name" >&2
              exit 1
            fi
          done
      - name: Establish AWS identity through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.HOWRELIABLE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.HOWRELIABLE_AWS_REGION }}
          role-session-name: howreliable-${{ github.run_id }}
      - name: Log in to existing ECR registry
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Reject an existing immutable SHA tag
        env:
          IMAGE_TAG: sha-${{ needs.validate.outputs.commit_sha }}
        run: |
          set -euo pipefail
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$IMAGE_TAG" > existing-image.json 2> ecr-error.txt; then
            echo "Immutable ECR tag already exists; refusing to overwrite: $IMAGE_TAG" >&2
            exit 1
          fi
          if ! grep -q 'ImageNotFoundException' ecr-error.txt; then
            cat ecr-error.txt >&2
            exit 1
          fi
      - name: Build and validate production image once
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: sha-${{ needs.validate.outputs.commit_sha }}
        run: |
          set -euo pipefail
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build --tag "$image_uri" .
          docker image inspect --format '{{json .Config}}' "$image_uri" > image-config.json
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("image-config.json").read_text())
          assert config["User"] == "10001:10001"
          assert "8000/tcp" in config["ExposedPorts"]
          assert config["Healthcheck"]["Test"][0] == "CMD"
          assert config["Cmd"][0] == "uvicorn"
          PY
          docker run --rm --entrypoint python "$image_uri" -c "import howreliable; import howreliable.api.app; print(howreliable.__version__)"
          docker run --rm --entrypoint python "$image_uri" -c "from pathlib import Path; forbidden=['/app/.env','/app/.git','/app/data','/app/artifacts','/home/howreliable/.aws','/app/.pytest_cache']; assert not [path for path in forbidden if Path(path).exists()]"
          echo "IMAGE_URI=$image_uri" >> "$GITHUB_ENV"
          echo "Image built and validated: $image_uri"
      - name: Push the validated image
        run: |
          set -euo pipefail
          docker push "$IMAGE_URI"
          image_digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=sha-${COMMIT_SHA}" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$image_digest" == sha256:* ]]
          echo "IMAGE_DIGEST=$image_digest" >> "$GITHUB_ENV"
          echo "Pushed immutable image digest: $image_digest"
      - name: Render and register task-definition revision
        id: task
        run: |
          set -euo pipefail
          python -m howreliable.cd.contract render-task \
            --source infrastructure/aws/ecs-task-definition.json \
            --output rendered-task-definition.json \
            --image-uri "$IMAGE_URI" \
            --region "$AWS_REGION" \
            --s3-bucket "$S3_BUCKET" \
            --s3-prefix "$S3_PREFIX" \
            --task-role-arn "$TASK_ROLE_ARN" \
            --execution-role-arn "$EXECUTION_ROLE_ARN"
          aws ecs register-task-definition --cli-input-json file://rendered-task-definition.json > registered-task.json
          task_definition="$(python -c 'import json; print(json.load(open("registered-task.json"))["taskDefinition"]["taskDefinitionArn"])')"
          echo "task_definition=$task_definition" >> "$GITHUB_OUTPUT"
          echo "Registered task definition: $task_definition"
      - name: Update service, wait, smoke, and roll back on failure
        env:
          NEW_TASK_DEFINITION: ${{ steps.task.outputs.task_definition }}
        run: |
          set -euo pipefail
          previous_task_definition="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)"
          [[ "$previous_task_definition" == arn:aws:ecs:* ]]
          echo "Previous task definition: $previous_task_definition"
          updated=false
          rollback() {
            original_status=$?
            trap - ERR
            if [[ "$updated" == true ]]; then
              echo "Deployment failed; restoring previous task definition" >&2
              set +e
              aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$previous_task_definition" --force-new-deployment
              timeout 20m aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
              rollback_status=$?
              set -e
              echo "Rollback stability status: $rollback_status" >&2
            fi
            echo "Original deployment failure preserved after rollback attempt" >&2
            exit "$original_status"
          }
          trap rollback ERR
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$NEW_TASK_DEFINITION" --force-new-deployment
          updated=true
          timeout 20m aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          smoke_args=(-m howreliable.cd.contract smoke --base-url "$API_BASE_URL")
          if [[ "$ALLOW_HTTP_SMOKE" == "true" ]]; then
            smoke_args+=(--allow-http)
          fi
          python "${smoke_args[@]}"
          trap - ERR
          echo "Service stable and post-deployment smoke passed"
          {
            echo "### HowReliable? production deployment"
            echo "- Commit: $COMMIT_SHA"
            echo "- Image: $IMAGE_URI"
            echo "- Digest: $IMAGE_DIGEST"
            echo "- Previous task definition: $previous_task_definition"
            echo "- New task definition: $NEW_TASK_DEFINITION"
            echo "- Smoke: passed"
          } >> "$GITHUB_STEP_SUMMARY"
